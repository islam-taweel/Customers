name: customer
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  flutter_native_splash: ^2.4.8
  url_launcher: ^6.3.2
  shared_preferences: ^2.3.0
  http: ^1.2.2
  pdf: ^3.11.0
  printing: ^5.13.0
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/splash/logo.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash/logo.png

  color_dark: "#0F1F1D"
  image_dark: assets/splash/logo.png

  android_12:
    color: "#FFFFFF"
    image: assets/splash/logo.png
    color_dark: "#0F1F1D"
    image_dark: assets/splash/logo.png

  android: true
  ios: true
  web: false